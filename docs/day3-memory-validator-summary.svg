<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">SysProbe Day 3 記憶體檢查流程</title>
  <desc id="description">從 cat /proc/meminfo 取得資料，經過命令執行、欄位解析、使用率計算與門檻比較，得到 PASS 或 FAIL；並說明 MemFree、MemAvailable、Swap 與錯誤處理。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .card-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 16px; font-weight: 700; }
      .formula { font-family: Consolas, "Cascadia Mono", monospace; font-size: 18px; font-weight: 700; fill: #92400e; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .status { font-size: 25px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1530" cy="50" r="180" fill="#ddd6fe" opacity="0.45"/>
  <circle cx="70" cy="860" r="190" fill="#bfdbfe" opacity="0.4"/>

  <text x="70" y="65" class="title">SysProbe Day 3｜記憶體檢查器</text>
  <text x="70" y="98" class="subtitle">資料 → 解析 → 計算 → 判斷，每一步都保留可追查的證據</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="225" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="80" y="180" class="step" fill="#1d4ed8">01 讀取 Linux 資料</text>
  <rect x="70" y="203" width="195" height="48" rx="10" fill="#1e3a8a"/>
  <text x="168" y="234" text-anchor="middle" class="code" fill="#ffffff">cat /proc/meminfo</text>
  <text x="80" y="283" class="body">取得核心提供的</text>
  <text x="80" y="310" class="body">即時記憶體數據</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="245" x2="335" y2="245" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="345" y="150" width="225" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="370" y="180" class="step" fill="#1d4ed8">02 CommandRunner</text>
  <text x="370" y="220" class="card-title">安全執行</text>
  <text x="370" y="256" class="body">不經過 shell</text>
  <text x="370" y="283" class="body">保留 stdout / stderr</text>
  <text x="370" y="310" class="body">exit code / timeout</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="245" x2="625" y2="245" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="635" y="135" width="270" height="220" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="660" y="168" class="step" fill="#1d4ed8">03 parse_meminfo</text>
  <text x="660" y="207" class="card-title">依名稱解析欄位</text>
  <text x="660" y="242" class="small">MemTotal　MemFree</text>
  <text x="660" y="268" class="small">MemAvailable　Buffers</text>
  <text x="660" y="294" class="small">Cached　SwapTotal</text>
  <text x="660" y="320" class="small">SwapFree（單位必須是 kB）</text>

  <!-- Arrow 3 -->
  <line x1="905" y1="245" x2="960" y2="245" stroke="#d97706" stroke-width="5" marker-end="url(#arrow-amber)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="970" y="150" width="300" height="190" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="995" y="180" class="step" fill="#b45309">04 計算 RAM 使用率</text>
  <text x="995" y="222" class="formula">used = MemTotal</text>
  <text x="995" y="250" class="formula">       - MemAvailable</text>
  <text x="995" y="288" class="formula">usage = used / MemTotal</text>
  <text x="995" y="316" class="small">× 100%</text>

  <!-- Arrow 4 -->
  <line x1="1270" y1="245" x2="1325" y2="245" stroke="#d97706" stroke-width="5" marker-end="url(#arrow-amber)"/>

  <!-- Step 5 decision -->
  <g filter="url(#shadow)">
    <path d="M 1420 140 L 1535 245 L 1420 350 L 1305 245 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="1420" y="215" text-anchor="middle" class="step" fill="#b45309">05 比較門檻</text>
  <text x="1420" y="250" text-anchor="middle" class="card-title">threshold = 90%</text>
  <text x="1420" y="282" text-anchor="middle" class="small">使用未四捨五入的數值</text>

  <!-- Pass and Fail results -->
  <path d="M 1388 322 C 1350 390, 1270 392, 1220 405" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1323" y="370" class="small" fill="#15803d">usage &lt; 90%</text>
  <g filter="url(#shadow)">
    <rect x="1030" y="390" width="230" height="90" rx="45" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="1145" y="445" text-anchor="middle" class="status" fill="#15803d">✓ PASS</text>

  <path d="M 1450 325 C 1505 370, 1505 405, 1470 425" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="1470" y="380" text-anchor="middle" class="small" fill="#b91c1c">usage ≥ 90%</text>
  <g filter="url(#shadow)">
    <rect x="1350" y="420" width="200" height="90" rx="45" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="1450" y="475" text-anchor="middle" class="status" fill="#b91c1c">✕ FAIL</text>

  <!-- Learning panel: Free vs Available -->
  <g filter="url(#shadow)">
    <rect x="55" y="420" width="500" height="250" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <rect x="55" y="420" width="13" height="250" rx="6" fill="#2563eb"/>
  <text x="90" y="463" class="panel-title" fill="#1d4ed8">為什麼不用 MemFree 判斷？</text>
  <rect x="90" y="490" width="185" height="130" rx="18" fill="#eff6ff"/>
  <text x="112" y="525" class="card-title">MemFree</text>
  <text x="112" y="557" class="body">現在完全沒被</text>
  <text x="112" y="584" class="body">使用的 RAM</text>
  <rect x="300" y="490" width="220" height="130" rx="18" fill="#dbeafe"/>
  <text x="322" y="525" class="card-title" fill="#1d4ed8">MemAvailable ✓</text>
  <text x="322" y="557" class="body">包含可回收空間</text>
  <text x="322" y="584" class="body">較能反映壓力</text>
  <text x="90" y="642" class="small">Linux 會善用閒置 RAM 做快取。</text>
  <text x="90" y="663" class="small">因此低 MemFree 不等於快沒記憶體。</text>

  <!-- Learning panel: Swap -->
  <g filter="url(#shadow)">
    <rect x="585" y="525" width="420" height="145" rx="24" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
  </g>
  <rect x="585" y="525" width="13" height="145" rx="6" fill="#9333ea"/>
  <text x="620" y="568" class="panel-title" fill="#7e22ce">Swap 是背景資訊</text>
  <text x="620" y="605" class="body">記錄 SwapTotal、SwapFree</text>
  <text x="620" y="638" class="body">但不改變 Day 3 的 PASS / FAIL</text>

  <!-- Failure panel -->
  <g filter="url(#shadow)">
    <rect x="1035" y="555" width="515" height="170" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  </g>
  <rect x="1035" y="555" width="13" height="170" rx="6" fill="#e11d48"/>
  <text x="1070" y="598" class="panel-title" fill="#be123c">先分辨「資料取得失敗」</text>
  <text x="1070" y="637" class="body">timeout ／ exit code ≠ 0 ／ 欄位格式錯誤</text>
  <text x="1070" y="676" class="body">→ FAIL + 清楚原因 + 原始 CommandResult</text>
  <text x="1070" y="700" class="small">因此能知道：記憶體真的超標，</text>
  <text x="1070" y="720" class="small">或是檢查本身沒有成功。</text>

  <!-- Footer -->
  <rect x="55" y="775" width="1495" height="78" rx="20" fill="#0f172a"/>
  <text x="90" y="808" class="body" fill="#bfdbfe">設計重點</text>
  <text x="90" y="836" class="body" fill="#ffffff">CommandRunner 收集事實　•　Parser 整理資料　•　Validator 決定政策　•　每個失敗都保留證據</text>
</svg>
